<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Kids Zone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #4facfe;
            --secondary: #00f2fe;
            --accent: #f441a5;
        }
        .back-button {
            position: absolute;
            top: 8vh;
            left: 2vh;
            padding: 10px 20px;
            border-radius: 30px;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(120, 99, 150, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .back-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(141, 84, 221, 0.6);
        }
        
        .back-button i {
            font-size: 1rem;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow-x: hidden;
            font-family: 'Kristen ITC', Arial, sans-serif;
        }

        .night-sky {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at bottom, #1a1a40 0%, #000010 100%);
            z-index: -2;
            overflow: hidden;
        }

        /* Star animation */
        @keyframes twinkle {
            0% { opacity: 0.2; }
            50% { opacity: 1; }
            100% { opacity: 0.2; }
        }

        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
            animation-delay: calc(var(--delay) * 1s);
        }

        /* Animated Nebula Effect */
        .nebula {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(106, 0, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 247, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 40% 60%, rgba(255, 0, 200, 0.1) 0%, transparent 50%);
            z-index: -1;
            animation: nebulaPulse 20s infinite alternate;
        }

        @keyframes nebulaPulse {
            0% { opacity: 0.7; filter: blur(0px); }
            50% { opacity: 1; filter: blur(2px); }
            100% { opacity: 0.7; filter: blur(0px); }
        }

        /* Shooting Stars */
        .shooting-star {
            position: absolute;
            width: 4px;
            height: 4px;
            background: linear-gradient(90deg, rgba(255,255,255,0), #fff);
            border-radius: 50%;
            filter: drop-shadow(0 0 6px #00f2fe);
            animation: shoot var(--speed) linear infinite;
            opacity: 0;
            transform: rotate(45deg);
            z-index: -1;
        }

        .shooting-star::before {
            content: '';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 100px;
            height: 1px;
            background: linear-gradient(90deg, #00f2fe, rgba(0, 247, 255, 0));
        }

        @keyframes shoot {
            0% { 
                opacity: 1;
                top: var(--top);
                left: var(--left);
            }
            100% { 
                opacity: 0;
                top: calc(var(--top) + 300px);
                left: calc(var(--left) + 300px);
            }
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            text-align: center;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            padding: 20px;
            width: 100%;
            max-width: 900px;
        }

        .option-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            transition: all 0.4s ease;
            cursor: pointer;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
            min-height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: inherit;
        }

        .option-card:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
            background: rgba(255, 255, 255, 0.15);
        }

        .option-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
        }

        .puzzles::before {
            background: linear-gradient(to right, #4deeea, #2a8f8c);
        }

        .coloring::before {
            background: linear-gradient(to right, #74ee15, #4a9510);
        }

        .memory-game::before {
            background: linear-gradient(to right, #f000ff, #a000a8);
        }

        .option-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            transition: all 0.4s ease;
        }

        .option-card:hover .option-icon {
            transform: scale(1.2) rotate(10deg);
        }

        .puzzles .option-icon {
            color: #4deeea;
            text-shadow: 0 0 20px rgba(77, 238, 234, 0.7);
        }

        .coloring .option-icon {
            color: #74ee15;
            text-shadow: 0 0 20px rgba(116, 238, 21, 0.7);
        }

        .memory-game .option-icon {
            color: #f000ff;
            text-shadow: 0 0 20px rgba(240, 0, 255, 0.7);
        }

        .option-card h3 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            font-weight: 700;
            color: white;
        }

        .play-btn {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 25px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 15px;
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .option-card:hover .play-btn {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .planet {
            position: absolute;
            border-radius: 50%;
            z-index: -1;
        }

        .planet-1 {
            width: 150px;
            height: 150px;
            background: radial-gradient(circle at 30% 30%, #ff9d00, #ff2e00);
            top: 10%;
            right: 5%;
            box-shadow: 0 0 50px #ff2e00;
            animation: float 8s infinite ease-in-out;
        }

        .planet-2 {
            width: 100px;
            height: 100px;
            background: radial-gradient(circle at 30% 30%, #00a2ff, #0055ff);
            bottom: 15%;
            left: 5%;
            box-shadow: 0 0 30px #0055ff;
            animation: float 6s infinite ease-in-out reverse;
        }

        .rocket {
            position: absolute;
            font-size: 2.5rem;
            bottom: 10%;
            right: 10%;
            animation: float 5s infinite ease-in-out;
        }

        .alien {
            position: absolute;
            font-size: 2rem;
            top: 20%;
            left: 8%;
            animation: bounce 4s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(10deg); }
            50% { transform: translateY(-20px) rotate(-5deg); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @media (max-width: 1024px) {
            .options-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 25px;
            }
            
            .planet-1, .planet-2 {
                display: none;
            }
        }

        @media (max-width: 768px) {
            .options-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .option-card {
                min-height: 220px;
                padding: 25px 15px;
            }
            
            .option-icon {
                font-size: 3.5rem;
            }
            
            .option-card h3 {
                font-size: 1.6rem;
            }
            
            .rocket, .alien {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .option-icon {
                font-size: 3rem;
            }
            
            .option-card h3 {
                font-size: 1.4rem;
            }
            
            .play-btn {
                padding: 8px 20px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <a href="home.html" class="back-button">
        <i class="fasfa-arrow-left"></i> Back
    </a>
    <div class="night-sky" id="night-sky"></div>
    <div class="nebula"></div>
    
    <div class="planet planet-1"></div>
    <div class="planet planet-2"></div>
    <div class="rocket">🚀</div>
    <div class="alien">👽</div>

    <div class="container">
        <div class="options-grid">
            <a href="puzzle.html" class="option-card puzzles">
                <div class="option-icon">
                    <i class="fas fa-puzzle-piece"></i>
                </div>
                <h3>Space Puzzles</h3>
                <div class="play-btn">Start Puzzle Mission</div>
            </a>

            <a href="coloring.html" class="option-card coloring">
                <div class="option-icon">
                    <i class="fas fa-palette"></i>
                </div>
                <h3>Galaxy Coloring</h3>
                <div class="play-btn">Launch Coloring</div>
            </a>

            <a href="memory.html" class="option-card memory-game">
                <div class="option-icon">
                    <i class="fas fa-brain"></i>
                </div>
                <h3>Memory Game</h3>
                <div class="play-btn">Start Memory Game</div>
            </a>
        </div>
    </div>

    <script>
        // Create stars for background
        function createStars() {
            const nightSky = document.getElementById('night-sky');
            const starCount = 150;
            
            // Clear existing stars first
            const existingStars = nightSky.querySelectorAll('.star');
            existingStars.forEach(star => star.remove());
            
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                
                const size = Math.random() * 2 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.setProperty('--delay', Math.random() * 5);
                
                nightSky.appendChild(star);
            }
        }

        // Create shooting stars
        function createShootingStars() {
            const nightSky = document.getElementById('night-sky');
            
            // Clear existing shooting stars first
            const existingShootingStars = nightSky.querySelectorAll('.shooting-star');
            existingShootingStars.forEach(star => star.remove());
            
            function createShootingStar() {
                const shootingStar = document.createElement('div');
                shootingStar.className = 'shooting-star';
                
                const top = Math.random() * 20;
                const left = Math.random() * 20;
                shootingStar.style.setProperty('--top', `${top}%`);
                shootingStar.style.setProperty('--left', `${left}%`);
                shootingStar.style.setProperty('--speed', `${Math.random() * 3 + 2}s`);
                
                nightSky.appendChild(shootingStar);
                
                setTimeout(() => {
                    shootingStar.remove();
                }, 3000);
            }
            
            // Create initial shooting stars
            for (let i = 0; i < 3; i++) {
                setTimeout(createShootingStar, i * 800);
            }
            
            // Continue creating shooting stars periodically
            setInterval(createShootingStar, 2000);
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', function() {
            createStars();
            createShootingStars();
        });
    </script>
</body>
</html>
