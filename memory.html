<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Memory Game</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6a00ff;
            --secondary: #00f7ff;
            --accent: #ff00c8;
            --dark: #0a0a20;
            --darker: #050510;
            --text: #e0e0ff;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body, html {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            font-family: 'Kristen ITC', Arial, sans-serif;
            color: var(--text);
        }
        
        /* Cosmic Background */
        .cosmic-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at bottom, var(--darker) 0%, var(--dark) 100%);
            z-index: -3;
        }
        
        /* Animated Nebula Effect */
        .nebula {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(106, 0, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 247, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 40% 60%, rgba(255, 0, 200, 0.1) 0%, transparent 50%);
            z-index: -2;
            animation: nebulaPulse 20s infinite alternate;
        }
        
        @keyframes nebulaPulse {
            0% { opacity: 0.7; filter: blur(0px); }
            50% { opacity: 1; filter: blur(2px); }
            100% { opacity: 0.7; filter: blur(0px); }
        }
        
        /* Stars */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        
        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
            opacity: 0;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0.1; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1); }
        }
        
        /* Shooting Stars */
        .shooting-star {
            position: absolute;
            width: 4px;
            height: 4px;
            background: linear-gradient(90deg, rgba(255,255,255,0), #fff);
            border-radius: 50%;
            filter: drop-shadow(0 0 6px var(--secondary));
            animation: shoot var(--speed) linear infinite;
            opacity: 0;
            transform: rotate(45deg);
        }
        
        .shooting-star::before {
            content: '';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 100px;
            height: 1px;
            background: linear-gradient(90deg, var(--secondary), rgba(0, 247, 255, 0));
        }
        
        @keyframes shoot {
            0% { 
                opacity: 1;
                top: var(--top);
                left: var(--left);
            }
            100% { 
                opacity: 0;
                top: calc(var(--top) + 300px);
                left: calc(var(--left) + 300px);
            }
        }
        
        /* Main Game Container */
        .game-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        
        /* Navigation */
        .game-nav {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            margin-bottom: 20px;
            background: rgba(10, 10, 32, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            box-shadow: 0 2px 30px rgba(0, 0, 0, 0.5);
            border-bottom: 1px solid rgba(106, 0, 255, 0.3);
        }
        
        .back-button {
            padding: 10px 20px;
            border-radius: 30px;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(106, 0, 255, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .back-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(106, 0, 255, 0.6);
        }
        
        .back-button i {
            font-size: 1rem;
        }
        
        .game-title {
            font-size: 2rem;
            font-weight: bold;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 1px;
            text-align: center;
            margin: 0 20px;
        }
        
        /* Game Board */
        .game-board {
            width: 100%;
            max-width: 600px;
            background: rgba(20, 20, 50, 0.7);
            border-radius: 15px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(79, 172, 254, 0.3);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.2);
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .card {
            aspect-ratio: 1;
            cursor: pointer;
            position: relative;
            perspective: 1000px;
            transform-style: preserve-3d;
            transition: transform 0.5s ease;
        }
        
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.5s;
            transform-style: preserve-3d;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        
        .card.flip .card-inner {
            transform: rotateY(180deg);
        }
        
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
        }
        
        .card-front {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            transform: rotateY(0deg);
        }
        
        .card-front i {
            font-size: 2.5rem;
            color: white;
        }
        
        .card-back {
            background: rgba(30, 30, 70, 0.9);
            border: 2px solid var(--secondary);
            transform: rotateY(180deg);
            padding: 10px;
        }
        
        .card-back img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 5px;
        }
        
        .card.shake {
            animation: shake 0.35s ease-in-out;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-13px); }
            40% { transform: translateX(13px); }
            60% { transform: translateX(-8px); }
            80% { transform: translateX(8px); }
        }
        
        .card.matched {
            animation: matched 0.5s ease;
        }
        
        @keyframes matched {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        /* Game Stats */
        .game-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(30, 30, 70, 0.7);
            border-radius: 10px;
            border: 1px solid rgba(79, 172, 254, 0.3);
            margin-bottom: 20px;
        }
        
        .stat {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: #a0a0c0;
            margin-bottom: 5px;
        }
        
        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--secondary);
        }
        
        .game-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        
        .game-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(106, 0, 255, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .game-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(106, 0, 255, 0.6);
        }
        
        .game-btn:active {
            transform: translateY(1px);
        }
        
        .game-btn i {
            font-size: 1rem;
        }
        
        /* Reward Screen */
        .reward-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 13, 27, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(5px);
        }
        
        .reward-content {
            background: rgba(20, 20, 50, 0.9);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--secondary);
            animation: rewardEntrance 0.5s ease-out;
        }
        
        @keyframes rewardEntrance {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .reward-title {
            font-size: 2.5rem;
            margin-bottom: 15px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .reward-message {
            font-size: 1.2rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .reward-stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
        }
        
        .reward-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .reward-stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: var(--secondary);
            margin-bottom: 5px;
        }
        
        .reward-stat-label {
            font-size: 0.9rem;
            color: #a0a0c0;
        }
        
        .reward-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .reward-btn {
            padding: 15px 30px;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 160px;
            justify-content: center;
        }
        
        .reward-btn i {
            font-size: 1rem;
        }
        
        .play-again {
            background: linear-gradient(45deg, var(--primary), var(--accent));
            color: white;
            box-shadow: 0 4px 15px rgba(106, 0, 255, 0.4);
        }
        
        .play-again:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(106, 0, 255, 0.6);
        }
        
        .go-home {
            background: rgba(30, 30, 70, 0.8);
            color: var(--secondary);
            border: 1px solid var(--secondary);
        }
        
        .go-home:hover {
            background: rgba(0, 247, 255, 0.1);
            transform: translateY(-3px);
        }
        
        /* Loading Screen */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 13, 27, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }
        
        .loading-content {
            text-align: center;
            color: white;
        }
        
        .cosmic-loader {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            position: relative;
        }
        
        .cosmic-loader:before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 5px solid transparent;
            border-top-color: var(--primary);
            border-bottom-color: var(--secondary);
            animation: cosmicSpin 1.5s linear infinite;
        }
        
        .cosmic-loader:after {
            content: "";
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border-radius: 50%;
            border: 5px solid transparent;
            border-top-color: var(--accent);
            border-bottom-color: #ff6b6b;
            animation: cosmicSpin 1s linear infinite reverse;
        }
        
        @keyframes cosmicSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            font-size: 1.2rem;
            margin-top: 20px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: textPulse 2s infinite;
        }
        
        @keyframes textPulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .game-title {
                font-size: 1.8rem;
            }
            
            .cards-grid {
                gap: 10px;
            }
            
            .card-front i {
                font-size: 2rem;
            }
            
            .stat-value {
                font-size: 1.2rem;
            }
            
            .game-btn {
                padding: 10px 20px;
                font-size: 0.9rem;
            }
            
            .reward-content {
                padding: 30px 20px;
            }
            
            .reward-title {
                font-size: 2rem;
            }
            
            .reward-message {
                font-size: 1rem;
            }
            
            .reward-stat-value {
                font-size: 1.5rem;
            }
            
            .reward-btn {
                padding: 12px 20px;
                font-size: 0.9rem;
                min-width: 140px;
            }
        }
        
        @media (max-width: 480px) {
            .game-nav {
                flex-direction: column;
                gap: 15px;
                padding: 15px;
            }
            
            .cards-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            
            .game-stats {
                flex-direction: column;
                gap: 15px;
            }
            
            .reward-buttons {
                flex-direction: column;
            }
            
            .reward-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Cosmic Background Elements -->
    <div class="cosmic-bg"></div>
    <div class="nebula"></div>
    <div class="stars" id="stars"></div>
    
    <!-- Loading Screen -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-content">
            <div class="cosmic-loader"></div>
            <div class="loading-text">Launching Cosmic Memory...</div>
        </div>
    </div>
    
    <!-- Main Game Container -->
    <div class="game-container">
        <nav class="game-nav">
            <a href="games.html" class="back-button">
                <i class="fas fa-arrow-left"></i> Back
            </a>
            <h1 class="game-title">COSMIC MEMORY</h1>
            <div></div> <!-- Empty div for spacing -->
        </nav>
        
        <div class="game-board">
            <div class="cards-grid" id="cardsGrid"></div>
            
            <div class="game-stats">
                <div class="stat">
                    <span class="stat-label">Time</span>
                    <span class="stat-value" id="timeValue">120</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Flips</span>
                    <span class="stat-value" id="flipsValue">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Matches</span>
                    <span class="stat-value" id="matchesValue">0/6</span>
                </div>
            </div>
            
            <div class="game-controls">
                <button class="game-btn" id="newGameBtn">
                    <i class="fas fa-sync-alt"></i> New Game
                </button>
            </div>
        </div>
    </div>
    
    <!-- Reward Screen -->
    <div class="reward-screen" id="rewardScreen">
        <div class="reward-content">
            <h2 class="reward-title">COSMIC VICTORY!</h2>
            <p class="reward-message">You've successfully matched all celestial pairs in the universe!</p>
            
            <div class="reward-stats">
                <div class="reward-stat">
                    <div class="reward-stat-value" id="finalTime">0s</div>
                    <div class="reward-stat-label">Time</div>
                </div>
                <div class="reward-stat">
                    <div class="reward-stat-value" id="finalFlips">0</div>
                    <div class="reward-stat-label">Flips</div>
                </div>
            </div>
            
            <div class="reward-buttons">
                <button class="reward-btn play-again" id="playAgainBtn">
                    <i class="fas fa-redo"></i> Play Again
                </button>
                <button class="reward-btn go-home" id="goHomeBtn">
                    <i class="fas fa-home"><a href="games.html"></a></i> Go Home
                </button>
            </div>
        </div>
    </div>
    
    <script>
        // Game variables
        const cardImages = [
            "comos.png",
            "alien.png",
            "astronut.png",
            "moon.png",
            "rocket.png",
            "space ship.png"
        ];
        
        let maxTime = 120;
        let timeLeft = maxTime;
        let flips = 0;
        let matchedPairs = 0;
        let totalPairs = cardImages.length;
        let disableDeck = false;
        let isPlaying = false;
        let cardOne = null;
        let cardTwo = null;
        let timer = null;
        
        // DOM elements
        const cardsGrid = document.getElementById('cardsGrid');
        const timeValue = document.getElementById('timeValue');
        const flipsValue = document.getElementById('flipsValue');
        const matchesValue = document.getElementById('matchesValue');
        const newGameBtn = document.getElementById('newGameBtn');
        const rewardScreen = document.getElementById('rewardScreen');
        const finalTime = document.getElementById('finalTime');
        const finalFlips = document.getElementById('finalFlips');
        const playAgainBtn = document.getElementById('playAgainBtn');
        const goHomeBtn = document.getElementById('goHomeBtn');
        const loadingScreen = document.getElementById('loadingScreen');
        
        // Create stars
        function createStars() {
            const starsContainer = document.getElementById('stars');
            const starCount = 200;
            
            // Create static stars
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                
                // Random size between 1px and 3px
                const size = Math.random() * 2 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                
                // Random position
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                
                // Random animation duration and delay
                star.style.setProperty('--duration', `${Math.random() * 3 + 2}s`);
                
                starsContainer.appendChild(star);
            }
            
            // Create shooting stars
            function createShootingStar() {
                const shootingStar = document.createElement('div');
                shootingStar.className = 'shooting-star';
                
                // Random position
                const top = Math.random() * 20;
                const left = Math.random() * 20;
                shootingStar.style.setProperty('--top', `${top}%`);
                shootingStar.style.setProperty('--left', `${left}%`);
                
                // Random speed
                shootingStar.style.setProperty('--speed', `${Math.random() * 3 + 2}s`);
                
                starsContainer.appendChild(shootingStar);
                
                // Remove after animation completes
                setTimeout(() => {
                    shootingStar.remove();
                }, 3000);
            }
            
            // Create shooting stars periodically
            setInterval(createShootingStar, 2000);
            
            // Create initial shooting stars
            for (let i = 0; i < 3; i++) {
                setTimeout(createShootingStar, i * 800);
            }
        }
        
        // Initialize game
        function initGame() {
            createStars();
            createCards();
            
            // Hide loading screen after everything is loaded
            setTimeout(() => {
                loadingScreen.style.opacity = '0';
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                }, 500);
            }, 1500);
        }
        
        // Create cards
        function createCards() {
            // Create pairs of cards
            let imagePairs = [...cardImages, ...cardImages];
            
            // Shuffle cards
            imagePairs = shuffleArray(imagePairs);
            
            // Clear existing cards
            cardsGrid.innerHTML = "";
            
            // Create new cards
            imagePairs.forEach((image, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.image = image;
                
                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-face card-front">
                            <i class="fas fa-question"></i>
                        </div>
                        <div class="card-face card-back">
                            <img src="${image}" alt="card-image">
                        </div>
                    </div>
                `;
                
                card.addEventListener('click', flipCard);
                cardsGrid.appendChild(card);
            });
        }
        
        // Shuffle array
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }
        
        // Flip card
        function flipCard() {
            if (!isPlaying) {
                isPlaying = true;
                timer = setInterval(updateTimer, 1000);
            }
            
            if (this === cardOne || disableDeck || timeLeft <= 0) return;
            
            this.classList.add('flip');
            flips++;
            flipsValue.textContent = flips;
            
            if (!cardOne) {
                cardOne = this;
                return;
            }
            
            cardTwo = this;
            disableDeck = true;
            checkForMatch();
        }
        
        // Check for match
        function checkForMatch() {
            const isMatch = cardOne.dataset.image === cardTwo.dataset.image;
            
            if (isMatch) {
                matchedPairs++;
                matchesValue.textContent = `${matchedPairs}/${totalPairs}`;
                
                cardOne.classList.add('matched');
                cardTwo.classList.add('matched');
                
                cardOne.removeEventListener('click', flipCard);
                cardTwo.removeEventListener('click', flipCard);
                
                if (matchedPairs === totalPairs) {
                    clearInterval(timer);
                    setTimeout(showReward, 1000);
                }
                
                resetTurn();
            } else {
                setTimeout(() => {
                    cardOne.classList.add('shake');
                    cardTwo.classList.add('shake');
                }, 400);
                
                setTimeout(() => {
                    cardOne.classList.remove('shake', 'flip');
                    cardTwo.classList.remove('shake', 'flip');
                    resetTurn();
                }, 1200);
            }
        }
        
        // Reset turn
        function resetTurn() {
            [cardOne, cardTwo] = [null, null];
            disableDeck = false;
        }
        
        // Update timer
        function updateTimer() {
            timeLeft--;
            timeValue.textContent = timeLeft;
            
            if (timeLeft <= 0) {
                clearInterval(timer);
                disableDeck = true;
                
                // Flip all cards back
                document.querySelectorAll('.card.flip:not(.matched)').forEach(card => {
                    setTimeout(() => {
                        card.classList.remove('flip');
                    }, 500);
                });
            }
        }
        
        // Show reward screen
        function showReward() {
            finalTime.textContent = `${maxTime - timeLeft}s`;
            finalFlips.textContent = flips;
            rewardScreen.style.display = 'flex';
        }
        
        // Hide reward screen
        function hideReward() {
            rewardScreen.style.display = 'none';
        }
        
        // Reset game
        function resetGame() {
            clearInterval(timer);
            
            timeLeft = maxTime;
            flips = 0;
            matchedPairs = 0;
            isPlaying = false;
            disableDeck = false;
            cardOne = null;
            cardTwo = null;
            
            timeValue.textContent = timeLeft;
            flipsValue.textContent = flips;
            matchesValue.textContent = `${matchedPairs}/${totalPairs}`;
            
            // Reset all cards
            document.querySelectorAll('.card').forEach(card => {
                card.classList.remove('flip', 'matched', 'shake');
                card.addEventListener('click', flipCard);
            });
            
            // Shuffle cards again after a delay
            setTimeout(() => {
                createCards();
            }, 300);
            
            hideReward();
        }
        
        // Event listeners
        newGameBtn.addEventListener('click', resetGame);
        playAgainBtn.addEventListener('click', resetGame);
        goHomeBtn.addEventListener('click', () => {
            window.location.href = 'cosmosexplorer.html';
        });
        
        // Initialize the game when the page loads
        window.addEventListener('load', initGame);
    </script>

</body>
</html>
