<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Login</title>
    <link rel="stylesheet" href="loginn.css">
</head>
<body>

    <div class="app-container" id="appContainer">
        
        <div class="lamp-container">
            <div class="lamp" id="lamp">
                
                <div class="lamp-shade lamp-dark">😴</div>
                <div class="lamp-stand"></div>

                <div class="lamp-light">
                    <div class="lamp-shade lamp-bright">😀</div>
                    <div class="light-glow"></div>
                </div>

                <div class="pull-cord" id="pullCord">
                    <div class="cord-thread"></div>
                    <div class="cord-ball"></div>
                </div>

            </div>
        </div>

        <div class="login-card-container is-hidden" id="loginCardContainer">
            <div class="login-card">
                <h2>Welcome Back</h2>
                
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter your username">
                
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password">

                <button class="login-button">Login</button>
                
                <a href="javascript:void(0)" class="forgot-link">Forgot Password?</a>
            </div>
        </div>
                <!-- Space Background Elements -->
        <div class="stars-layer-1"></div>
        <div class="stars-layer-2"></div>
        <div class="planet-glow"></div>

        <!-- Shooting Stars -->
        <div class="space-shooting-stars">
            <div class="space-shooting-star"></div>
            <div class="space-shooting-star"></div>
            <div class="space-shooting-star"></div>
            <div class="space-shooting-star"></div>
            <div class="space-shooting-star"></div>
            <div class="space-shooting-star"></div>
        </div>

        <!-- Space Dust -->
        <div class="space-dust">
            <div class="dust-particle"></div>
            <div class="dust-particle"></div>
            <div class="dust-particle"></div>
            <div class="dust-particle"></div>
        </div>

        
        
    </div>

    <script src="loginnn.js"></script>
</body>
</html>
