<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Space Science Mission</title>
  <style>
    * {
      box-sizing: border-box;
      padding: 0;
      margin: 0;
      font-family: "Poppins", system-ui, sans-serif;
    }
    .back-button {
            position: absolute;
            top: 8vh;
            left: 2vh;
            padding: 10px 20px;
            border-radius: 30px;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(120, 99, 150, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .back-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(141, 84, 221, 0.6);
        }
        
        .back-button i {
            font-size: 1rem;
        }

    body {
      background: radial-gradient(circle at top, #1b1f4b, #050616);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Space Background (subtle) */
    .space-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      background:
        radial-gradient(circle at 20% 30%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(255, 119, 198, 0.2) 0%, transparent 50%),
        radial-gradient(circle at 40% 80%, rgba(120, 219, 255, 0.2) 0%, transparent 50%),
        radial-gradient(ellipse at bottom, #1b1f4b 0%, #050616 70%);
    }

    .stars {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(2px 2px at 20px 30px, #eee, transparent),
        radial-gradient(2px 2px at 40px 70px, #fff, transparent),
        radial-gradient(1px 1px at 90px 40px, #fff, transparent),
        radial-gradient(1px 1px at 130px 80px, #fff, transparent),
        radial-gradient(2px 2px at 160px 30px, #eee, transparent),
        radial-gradient(1px 1px at 210px 60px, #fff, transparent),
        radial-gradient(2px 2px at 250px 90px, #eee, transparent),
        radial-gradient(1px 1px at 290px 20px, #fff, transparent);
      background-repeat: repeat;
      background-size: 550px 550px;
      animation: twinkle 8s ease-in-out infinite alternate;
      z-index: -1;
    }

    @keyframes twinkle {
      0% { opacity: 0.7; }
      100% { opacity: 1; }
    }

    /* Floating astronauts / UFO / satellite OUTSIDE card */
    .floating-astro,
    .floating-ufo,
    .floating-satellite {
      position: absolute;
      font-size: 30px;
      opacity: 0.9;
      pointer-events: none;
      z-index: -1;
    }

    .floating-astro {
      top: 15%;
      left: 10%;
      animation: float-up 4s ease-in-out infinite alternate;
    }

    .floating-ufo {
      top: 12%;
      right: 12%;
      animation: float-side 5s ease-in-out infinite alternate;
    }

    .floating-satellite {
      bottom: 10%;
      right: 20%;
      animation: float-diag 6s ease-in-out infinite alternate;
    }

    @keyframes float-up {
      0% { transform: translateY(0); }
      100% { transform: translateY(-10px); }
    }

    @keyframes float-side {
      0% { transform: translateX(0); }
      100% { transform: translateX(15px); }
    }

    @keyframes float-diag {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-12px, -8px); }
    }

    .page-wrapper {
      width: 100%;
      max-width: 1100px;
      aspect-ratio: 16 / 9;
      background: linear-gradient(#2a124e, #1b0f2f);
      border-radius: 24px;
      padding: 16px 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      position: relative;
      overflow: hidden;
      z-index: 1;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .page-header h1 {
      font-size: 28px;
      letter-spacing: 1px;
    }

    .page-header span {
      font-size: 14px;
      opacity: 0.8;
    }

    /* Map area */
    .space-map {
      position: relative;
      width: 100%;
      height: calc(100% - 52px);
      border-radius: 20px;
      padding: 16px;
      overflow: hidden;
      background: radial-gradient(
        circle at top,
        #43308a 0%,
        #1a0f3e 45%,
        #070418 100%
      );
    }

    /* Rocket */
    .rocket {
      position: absolute;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 36px;
      z-index: 2;
      transform: translate(-50%, -50%);
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
      transition: transform 0.2s ease;
      filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.6));
    }

    /* Topic nodes (PLANETS) */
    .topic-node {
      position: absolute;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.3s ease;
      z-index: 1;
      filter: drop-shadow(0 0 10px currentColor);
    }

    .topic-node:nth-child(2) { 
      background: radial-gradient(circle at 30% 20%, #ff9e9e, #ff5252);
      filter: drop-shadow(0 0 15px rgba(255, 82, 82, 0.7));
    }
    .topic-node:nth-child(3) { 
      background: radial-gradient(circle at 30% 20%, #ffd699, #ff9800);
      filter: drop-shadow(0 0 15px rgba(255, 152, 0, 0.7));
    }
    .topic-node:nth-child(4) { 
      background: radial-gradient(circle at 30% 20%, #c8e6c9, #4caf50);
      filter: drop-shadow(0 0 15px rgba(76, 175, 80, 0.7));
    }
    .topic-node:nth-child(5) { 
      background: radial-gradient(circle at 30% 20%, #b3e5fc, #03a9f4);
      filter: drop-shadow(0 0 15px rgba(3, 169, 244, 0.7));
    }
    .topic-node:nth-child(6) { 
      background: radial-gradient(circle at 30% 20%, #e1bee7, #9c27b0);
      filter: drop-shadow(0 0 15px rgba(156, 39, 176, 0.7));
    }
    .topic-node:nth-child(7) { 
      background: radial-gradient(circle at 30% 20%, #ffcc80, #ff5722);
      filter: drop-shadow(0 0 15px rgba(255, 87, 34, 0.7));
    }
    .topic-node:nth-child(8) { 
      background: radial-gradient(circle at 30% 20%, #f8bbd0, #e91e63);
      filter: drop-shadow(0 0 15px rgba(233, 30, 99, 0.7));
    }
    .topic-node:nth-child(9) { 
      background: radial-gradient(circle at 30% 20%, #d7ccc8, #795548);
      filter: drop-shadow(0 0 15px rgba(121, 85, 72, 0.7));
    }
    /* Special styling for All Topics planet - BIGGER and MORE GLOW */
    .topic-node:nth-child(10) { 
      background: radial-gradient(circle at 30% 20%, #ffe8ff, #8a63ff);
      width: 110px;
      height: 110px;
      border: 4px solid rgba(255, 255, 255, 0.6);
      filter: drop-shadow(0 0 25px rgba(138, 99, 255, 0.9));
      animation: pulse-glow 2s ease-in-out infinite alternate;
    }

    @keyframes pulse-glow {
      0% { 
        filter: drop-shadow(0 0 20px rgba(138, 99, 255, 0.7));
        transform: scale(1);
      }
      100% { 
        filter: drop-shadow(0 0 30px rgba(138, 99, 255, 1));
        transform: scale(1.05);
      }
    }

    .topic-node span.number {
      font-size: 20px;
      font-weight: 700;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    .topic-node span.label {
      font-size: 12px;
      margin-top: 4px;
      text-align: center;
      padding: 0 4px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
      font-weight: 600;
    }

    .topic-node:nth-child(10) span.number {
      font-size: 24px;
    }

    .topic-node:nth-child(10) span.label {
      font-size: 14px;
      font-weight: 700;
    }

    .topic-node:hover {
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
      filter: brightness(1.2) drop-shadow(0 0 20px currentColor);
    }

    .topic-node:nth-child(10):hover {
      transform: translateY(-4px) scale(1.1);
      filter: brightness(1.3) drop-shadow(0 0 35px rgba(138, 99, 255, 1));
    }

    /* Popup / Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 99;
      backdrop-filter: blur(5px);
    }

    .modal {
      width: min(600px, 90vw);
      background: linear-gradient(135deg, #1b1230, #2a1a4a);
      border-radius: 20px;
      padding: 20px 22px 18px;
      box-shadow:
        0 20px 40px rgba(0, 0, 0, 0.8),
        0 0 0 1px rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      position: relative;
      backdrop-filter: blur(10px);
    }

    .modal h2 {
      font-size: 26px;
      margin-bottom: 6px;
      background: linear-gradient(90deg, #ffb84a, #ff64b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .modal p {
      font-size: 16px;
      line-height: 1.4;
      margin-bottom: 10px;
      opacity: 0.9;
      white-space: pre-line;
    }

    .video-box {
      background: #0b0716;
      border-radius: 14px;
      padding: 8px;
      margin-bottom: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .video-box iframe {
      width: 100%;
      height: 220px;
      border: none;
      border-radius: 10px;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
    }

    .btn {
      border: none;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: linear-gradient(90deg, #ffb84a, #ff64b8);
      color: #1b1230;
      font-weight: 600;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(255, 184, 74, 0.4);
    }

    .btn-secondary {
      background: transparent;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .close-x {
      position: absolute;
      top: 10px;
      right: 14px;
      font-size: 18px;
      cursor: pointer;
      opacity: 0.7;
      background: rgba(255, 255, 255, 0.1);
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .close-x:hover {
      opacity: 1;
      background: rgba(255, 255, 255, 0.2);
    }

    /* Quiz Styles */
    .quiz-container {
      display: none;
      flex-direction: column;
      gap: 15px;
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .quiz-header h2 {
      font-size: 22px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .quiz-header h2::before {
      content: "🧠";
    }

    .question-counter {
      font-size: 14px;
      opacity: 0.8;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
      margin-bottom: 10px;
    }

    .progress-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #ffb84a, #ff64b8);
      transition: width 0.3s ease;
    }

    .question-text {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 18px;
    }

    .option {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 10px 14px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .option-badge {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
    }

    .option-text {
      font-size: 15px;
    }

    .option:hover {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.5);
    }

    .option.selected {
      background: rgba(255, 184, 74, 0.23);
      border-color: #ffb84a;
      box-shadow: 0 0 12px rgba(255, 184, 74, 0.5);
    }

    .quiz-navigation {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .quiz-btn {
      padding: 9px 20px;
      border: none;
      border-radius: 25px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .quiz-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .prev-btn {
      background: transparent;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .next-btn, .submit-btn {
      background: linear-gradient(90deg, #ffb84a, #ff64b8);
      color: #1b1230;
      font-weight: 600;
    }

    .next-btn:hover, .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(255, 184, 74, 0.4);
    }

    .results-container {
      display: none;
      flex-direction: column;
      gap: 15px;
      text-align: center;
    }

    .score-display {
      font-size: 24px;
      font-weight: 700;
      margin: 10px 0;
      color: #ffb84a;
    }

    .results-list {
      text-align: left;
      max-height: 260px;
      overflow-y: auto;
      padding: 10px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 10px;
    }

    .result-item {
      margin-bottom: 12px;
      padding: 8px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
    }

    .result-question {
      font-weight: 600;
      margin-bottom: 6px;
    }

    .correct-answer {
      color: #4CAF50;
      font-weight: 600;
      font-size: 14px;
    }

    .user-answer {
      margin-top: 4px;
      font-size: 14px;
    }

    .user-answer.correct {
      color: #4CAF50;
    }

    .user-answer.incorrect {
      color: #f44336;
    }

    @media (max-width: 800px) {
      .page-wrapper {
        border-radius: 0;
        box-shadow: none;
      }
      .topic-node {
        width: 70px;
        height: 70px;
      }
      .topic-node:nth-child(10) {
        width: 85px;
        height: 85px;
      }
      .rocket {
        width: 55px;
        height: 55px;
      }
    }
  </style>
</head>

    const rocket = document.getElementById("rocket");
    const spaceMap = document.getElementById("spaceMap");
    const nodes = document.querySelectorAll(".topic-node");

    const modalOverlay = document.getElementById("modalOverlay");
    const closeModal = document.getElementById("closeModal");
    const closeButton = document.getElementById("closeButton");
    const quizButton = document.getElementById("quizButton");
    const modalTitle = document.getElementById("modalTitle");
    const modalDescription = document.getElementById("modalDescription");
    const videoBox = document.getElementById("videoBox");
    const modalVideo = document.getElementById("modalVideo");

    const quizModalOverlay = document.getElementById("quizModalOverlay");
    const closeQuizModal = document.getElementById("closeQuizModal");
    const quizContainer = document.getElementById("quizContainer");
    const resultsContainer = document.getElementById("resultsContainer");
    const quizTitle = document.getElementById("quizTitle");
    const questionCounter = document.getElementById("questionCounter");
    const questionText = document.getElementById("questionText");
    const optionsContainer = document.getElementById("optionsContainer");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const submitBtn = document.getElementById("submitBtn");
    const scoreDisplay = document.getElementById("scoreDisplay");
    const resultsMessage = document.getElementById("resultsMessage");
    const resultsList = document.getElementById("resultsList");
    const retryButton = document.getElementById("retryButton");
    const closeResultsButton = document.getElementById("closeResultsButton");
    const progressFill = document.getElementById("progressFill");

    let rocketPos = { x: null, y: null };
    let currentTopicIndex = 0;

    // Quiz State
    let currentQuestion = 0;
    let userAnswers = [];
    let quizQuestions = [];

    // Center of a topic node inside the map
    function getNodeCenter(node) {
      const mapRect = spaceMap.getBoundingClientRect();
      const nodeRect = node.getBoundingClientRect();

      const x = nodeRect.left - mapRect.left + nodeRect.width / 2;
      const y = nodeRect.top - mapRect.top + nodeRect.height / 2;
      return { x, y };
    }

    // Instantly place rocket – used at start
    function placeRocketInstant(node) {
      const { x, y } = getNodeCenter(node);
      rocket.style.left = x + "px";
      rocket.style.top = y + "px";
      rocketPos = { x, y };
    }

    // Animate rocket from current position to target position
    function animateRocketTo(node, callback) {
      const target = getNodeCenter(node);

      if (rocketPos.x === null || rocketPos.y === null) {
        placeRocketInstant(node);
        if (callback) callback();
        return;
      }

      const startX = rocketPos.x;
      const startY = rocketPos.y;
      const deltaX = target.x - startX;
      const deltaY = target.y - startY;
      const duration = 800; // ms
      const startTime = performance.now();

      function step(now) {
        const elapsed = now - startTime;
        const t = Math.min(elapsed / duration, 1); // 0 → 1

        const ease = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t; // ease-in-out

        const x = startX + deltaX * ease;
        const y = startY + deltaY * ease;

        rocket.style.left = x + "px";
        rocket.style.top = y + "px";

        const angle = Math.atan2(deltaY, deltaX);
        rocket.style.transform = `translate(-50%, -50%) rotate(${angle}rad)`;

        if (t < 1) {
          requestAnimationFrame(step);
        } else {
          rocket.style.transform = "translate(-50%, -50%)";
          rocketPos = { x: target.x, y: target.y };
          setTimeout(() => {
            if (callback) callback();
          }, 2000);
        }
      }

      requestAnimationFrame(step);
    }

    // Show modal with topic details
    function showTopicModal(index) {
      const topic = topics[index];
      currentTopicIndex = index;

      modalTitle.textContent = topic.title;
      modalDescription.textContent = topic.description;

      if (topic.video) {
        videoBox.style.display = "block";
        modalVideo.src = topic.video;
      } else {
        videoBox.style.display = "none";
        modalVideo.src = "";
      }

      modalOverlay.style.display = "flex";
    }

    // Quiz Functions
    function startQuiz() {
      quizQuestions = quizData[currentTopicIndex] || quizData[0];

      currentQuestion = 0;
      userAnswers = new Array(quizQuestions.length).fill(null);

      modalOverlay.style.display = "none";
      quizModalOverlay.style.display = "flex";

      quizTitle.textContent =
        currentTopicIndex === 8
          ? "All Topics Mega Quiz"
          : `${topics[currentTopicIndex].title} Quiz`;

      quizContainer.style.display = "flex";
      resultsContainer.style.display = "none";

      loadQuestion();
    }

    function loadQuestion() {
      const question = quizQuestions[currentQuestion];

      questionCounter.textContent = `Question ${currentQuestion + 1} of ${quizQuestions.length}`;
      questionText.textContent = question.question;

      const progressPercent = ((currentQuestion + 1) / quizQuestions.length) * 100;
      progressFill.style.width = progressPercent + "%";

      optionsContainer.innerHTML = "";
      question.options.forEach((option, index) => {
        const optionElement = document.createElement("div");
        optionElement.className =
          "option" + (userAnswers[currentQuestion] === index ? " selected" : "");

        const badge = document.createElement("div");
        badge.className = "option-badge";
        badge.textContent = String.fromCharCode(65 + index); // A, B, C, D

        const text = document.createElement("div");
        text.className = "option-text";
        text.textContent = option;

        optionElement.appendChild(badge);
        optionElement.appendChild(text);

        optionElement.addEventListener("click", () => selectOption(index));
        optionsContainer.appendChild(optionElement);
      });

      prevBtn.disabled = currentQuestion === 0;

      if (currentQuestion === quizQuestions.length - 1) {
        nextBtn.style.display = "none";
        submitBtn.style.display = "block";
      } else {
        nextBtn.style.display = "block";
        submitBtn.style.display = "none";
      }
    }

    function selectOption(optionIndex) {
      userAnswers[currentQuestion] = optionIndex;
      loadQuestion();
    }

    function nextQuestion() {
      if (userAnswers[currentQuestion] === null) {
        alert("Pick an answer before going to the next question 🌟");
        return;
      }
      currentQuestion++;
      loadQuestion();
    }

    function prevQuestion() {
      currentQuestion--;
      loadQuestion();
    }

    function submitQuiz() {
      if (userAnswers[currentQuestion] === null) {
        alert("Pick an answer before submitting 🚀");
        return;
      }

      let score = 0;
      quizQuestions.forEach((question, index) => {
        if (userAnswers[index] === question.correct) {
          score++;
        }
      });

      showResults(score);
    }

    function showResults(score) {
      quizContainer.style.display = "none";
      resultsContainer.style.display = "flex";

      const percentage = (score / quizQuestions.length) * 100;
      scoreDisplay.textContent = `${score}/${quizQuestions.length}`;

      if (percentage >= 80) {
        resultsMessage.textContent = "Excellent! You're a math superstar! 🚀✨";
      } else if (percentage >= 60) {
        resultsMessage.textContent = "Nice work! Keep practicing and you'll fly even higher! 🌟";
      } else {
        resultsMessage.textContent = "Good try! You can always retry the mission 💫";
      }

      resultsList.innerHTML = "";
      quizQuestions.forEach((question, index) => {
        const resultItem = document.createElement("div");
        resultItem.className = "result-item";

        const isCorrect = userAnswers[index] === question.correct;
        const userAnswerText =
          userAnswers[index] !== null
            ? question.options[userAnswers[index]]
            : "Not answered";

        resultItem.innerHTML = `
          <div class="result-question">${index + 1}. ${question.question}</div>
          <div class="correct-answer">Correct: ${question.options[question.correct]}</div>
          <div class="user-answer ${isCorrect ? "correct" : "incorrect"}">
            Your answer: ${userAnswerText} ${isCorrect ? "✓" : "✗"}
          </div>
        `;

        resultsList.appendChild(resultItem);
      });
    }

    function retryQuiz() {
      startQuiz();
    }

    function closeQuiz() {
      quizModalOverlay.style.display = "none";
    }

    // Initial position on first planet
    window.addEventListener("load", () => {
      placeRocketInstant(nodes[0]);
    });

    // When clicking a topic:
    nodes.forEach((node) => {
      node.addEventListener("click", () => {
        const index = parseInt(node.dataset.index, 10);

        nodes.forEach((n) => (n.disabled = true));

        animateRocketTo(node, () => {
          showTopicModal(index);
          nodes.forEach((n) => (n.disabled = false));
        });
      });
    });

    // Close learning popup
    function hideModal() {
      modalOverlay.style.display = "none";
      modalVideo.src = "";
    }

    closeModal.addEventListener("click", hideModal);
    closeButton.addEventListener("click", hideModal);
    modalOverlay.addEventListener("click", (e) => {
      if (e.target === modalOverlay) hideModal();
    });

    // Quiz button in learning modal
    quizButton.addEventListener("click", startQuiz);

    // Quiz navigation
    prevBtn.addEventListener("click", prevQuestion);
    nextBtn.addEventListener("click", nextQuestion);
    submitBtn.addEventListener("click", submitQuiz);

    // Quiz modal close
    closeQuizModal.addEventListener("click", closeQuiz);
    closeResultsButton.addEventListener("click", closeQuiz);
    quizModalOverlay.addEventListener("click", (e) => {
      if (e.target === quizModalOverlay) closeQuiz();
    });

    // Retry button
    retryButton.addEventListener("click", retryQuiz);
