<!DOCTYPE html>
<html>
<head>
    <title>Cosmic Puzzle Challenge</title>
    <style>
        :root {
            --primary: #6a00ff;
            --secondary: #00f7ff;
            --accent: #ff00c8;
            --dark: #0a0a20;
            --darker: #050510;
            --text: #e0e0ff;
        }
        
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Kristen ITC', Arial, sans-serif;
        }
        
        /* Cosmic Background */
        .cosmic-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at bottom, var(--darker) 0%, var(--dark) 100%);
            z-index: -3;
        }
        
        /* Animated Nebula Effect */
        .nebula {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(106, 0, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 247, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 40% 60%, rgba(255, 0, 200, 0.1) 0%, transparent 50%);
            z-index: -2;
            animation: nebulaPulse 20s infinite alternate;
        }
        
        @keyframes nebulaPulse {
            0% { opacity: 0.7; filter: blur(0px); }
            50% { opacity: 1; filter: blur(2px); }
            100% { opacity: 0.7; filter: blur(0px); }
        }
        
        /* Stars */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        
        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
            opacity: 0;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0.1; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1); }
        }
         .back-button {
            position: absolute;
            top: 8vh;
            left: 2vh;
            padding: 10px 20px;
            border-radius: 30px;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(106, 0, 255, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .back-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(106, 0, 255, 0.6);
        }
        
        .back-button i {
            font-size: 1rem;
        }

        /* Shooting Stars */
        .shooting-star {
            position: absolute;
            width: 4px;
            height: 4px;
            background: linear-gradient(90deg, rgba(255,255,255,0), #fff);
            border-radius: 50%;
            filter: drop-shadow(0 0 6px var(--secondary));
            animation: shoot var(--speed) linear infinite;
            opacity: 0;
            transform: rotate(45deg);
        }
        
        .shooting-star::before {
            content: '';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 100px;
            height: 1px;
            background: linear-gradient(90deg, var(--secondary), rgba(0, 247, 255, 0));
        }
        
        @keyframes shoot {
            0% { 
                opacity: 1;
                top: var(--top);
                left: var(--left);
            }
            100% { 
                opacity: 0;
                top: calc(var(--top) + 300px);
                left: calc(var(--left) + 300px);
            }
        }

        .puzzle-game-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 50, 0.7);
            border-radius: 20px;
            padding: 20px;
            border: 2px solid var(--secondary);
            box-shadow: 0 0 30px rgba(0, 247, 255, 0.3);
            text-align: center;
            width: 350px;
            backdrop-filter: blur(5px);
        }

        .puzzle-title {
            color: var(--secondary);
            font-size: 1.8em;
            margin: 0 0 10px 0;
            text-shadow: 0 0 8px var(--primary);
            letter-spacing: 1px;
        }

        .timer {
            color: var(--secondary);
            font-size: 1.2em;
            margin-bottom: 10px;
            font-weight: bold;
            text-shadow: 0 0 5px var(--primary);
        }

        .puzzle-container {
            width: 300px;
            height: 300px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 2px;
            background-color: rgba(52, 73, 94, 0.5);
            border: 3px solid rgba(79, 172, 254, 0.5);
            border-radius: 15px;
            overflow: hidden;
            margin: 0 auto 10px;
        }
        
        .puzzle-piece {
            width: 100%;
            height: 100%;
            background-size: 300px 300px;
            cursor: grab;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .puzzle-piece:active {
            cursor: grabbing;
            transform: scale(0.98);
            z-index: 10;
            box-shadow: 0 0 15px var(--accent);
        }
        
        .puzzle-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
        }
        
        .puzzle-btn {
            padding: 8px 15px;
            font-size: 14px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Kristen ITC', Arial, sans-serif;
            font-weight: bold;
            transition: all 0.2s;
            box-shadow: 0 4px 8px rgba(106, 0, 255, 0.3);
        }
        
        .puzzle-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(106, 0, 255, 0.4);
        }
        
        .feedback {
            font-size: 1.1em;
            font-weight: bold;
            margin: 10px 0;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        
        .win {
            color: #4CAF50;
            text-shadow: 0 0 5px rgba(76, 175, 80, 0.7);
        }
        
        .lose {
            color: #f44336;
            text-shadow: 0 0 5px rgba(244, 67, 54, 0.5);
        }
        
        .emoji {
            font-size: 1.5em;
            margin-left: 5px;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .critical-time {
            animation: pulse 0.5s infinite alternate;
            color: #f44336 !important;
        }

        .back-button {
            position: absolute;
            top: 8vh;
            left: 2vh;
            padding: 10px 20px;
            border-radius: 30px;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(106, 0, 255, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .back-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(106, 0, 255, 0.6);
        }
        
        .back-button i {
            font-size: 1rem;
        }

        /* Loading Screen */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 13, 27, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }
        
        .loading-content {
            text-align: center;
            color: white;
        }
        
        .cosmic-loader {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            position: relative;
        }
        
        .cosmic-loader:before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 5px solid transparent;
            border-top-color: var(--primary);
            border-bottom-color: var(--secondary);
            animation: cosmicSpin 1.5s linear infinite;
        }
        
        .cosmic-loader:after {
            content: "";
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border-radius: 50%;
            border: 5px solid transparent;
            border-top-color: var(--accent);
            border-bottom-color: #ff6b6b;
            animation: cosmicSpin 1s linear infinite reverse;
        }
        
        @keyframes cosmicSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            font-size: 1.2rem;
            margin-top: 20px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: textPulse 2s infinite;
        }
        
        @keyframes textPulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <!-- Cosmic Background Elements -->
    <div class="cosmic-bg"></div>
    <div class="nebula"></div>
    <div class="stars" id="stars"></div>
    
    <!-- Loading Screen -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-content">
            <div class="cosmic-loader"></div>
            <div class="loading-text">Launching Cosmic Puzzle...</div>
        </div>
    </div>
    <a href="games.html" class="back-button">
        <i class="fasfa-arrow-left"></i> Back
    </a>
    
    <!-- Game Container -->
    <div class="puzzle-game-container">
        <h1 class="puzzle-title">Cosmic Puzzle Challenge</h1>
        <div class="timer" id="timer">02:00</div>
        
        <div class="puzzle-container" id="puzzleContainer"></div>
        
        <div class="feedback" id="feedback"></div>
        
        <div class="puzzle-controls">
            <button class="puzzle-btn" id="shuffleBtn">Shuffle</button>
            <button class="puzzle-btn" id="resetBtn">New Puzzle</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Create cosmic background elements
            function createCosmicBackground() {
                const starsContainer = document.getElementById('stars');
                const starCount = 200;
                
                // Create static stars
                for (let i = 0; i < starCount; i++) {
                    const star = document.createElement('div');
                    star.className = 'star';
                    
                    // Random size between 1px and 3px
                    const size = Math.random() * 2 + 1;
                    star.style.width = `${size}px`;
                    star.style.height = `${size}px`;
                    
                    // Random position
                    star.style.left = `${Math.random() * 100}%`;
                    star.style.top = `${Math.random() * 100}%`;
                    
                    // Random animation duration and delay
                    star.style.setProperty('--duration', `${Math.random() * 3 + 2}s`);
                    
                    starsContainer.appendChild(star);
                }
                
                // Create shooting stars
                function createShootingStar() {
                    const shootingStar = document.createElement('div');
                    shootingStar.className = 'shooting-star';
                    
                    // Random position
                    const top = Math.random() * 20;
                    const left = Math.random() * 20;
                    shootingStar.style.setProperty('--top', `${top}%`);
                    shootingStar.style.setProperty('--left', `${left}%`);
                    
                    // Random speed
                    shootingStar.style.setProperty('--speed', `${Math.random() * 3 + 2}s`);
                    
                    starsContainer.appendChild(shootingStar);
                    
                    // Remove after animation completes
                    setTimeout(() => {
                        shootingStar.remove();
                    }, 3000);
                }
                
                // Create shooting stars periodically
                setInterval(createShootingStar, 2000);
                
                // Create initial shooting stars
                for (let i = 0; i < 3; i++) {
                    setTimeout(createShootingStar, i * 800);
                }
            }
            
            createCosmicBackground();

            // Game elements
            const puzzleContainer = document.getElementById('puzzleContainer');
            const timerElement = document.getElementById('timer');
            const feedbackElement = document.getElementById('feedback');
            const shuffleBtn = document.getElementById('shuffleBtn');
            const resetBtn = document.getElementById('resetBtn');
            const loadingScreen = document.getElementById('loadingScreen');
            
            // Game variables
            let pieces = [], draggedPiece = null;
            let timeLeft = 120; // 2 minutes in seconds
            let timer;
            let gameActive = true;
            
            const spaceImages = [
                "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQSnb_6yXGOX6XZMv8cH72wzFJdO1t5WTKTwg&s",
                "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRkoN3TtUn1711VA1euwPHE5YYohWlSZxpchg&s",
                "https://img.freepik.com/free-vector/cute-planet-saturn-space-cartoon-vector-icon-illustration-science-nature-icon-concept-isolated_138676-7555.jpg",
                "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTdwlvqvMsViJN2xyIf7eimYwDZB-8jasqUKw&s",
                "https://i.ytimg.com/vi/tyg5ic16YgQ/maxresdefault.jpg",
                "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSEoaB4lh-aL92pxyZXruD2QVskihNwZDxcog&s",
                "https://static.vecteezy.com/system/resources/previews/010/523/811/non_2x/cartoon-cute-mars-planet-isolated-on-white-background-planet-of-solar-system-cartoon-style-illustration-for-any-design-vector.jpg",
                "https://static.vecteezy.com/system/resources/previews/024/822/350/non_2x/cute-earth-global-world-cartoon-on-transparent-background-generative-ai-digital-illustration-png.png",
                "https://c8.alamy.com/comp/RWKXPP/cute-planets-with-funny-smiling-faces-solar-system-with-cute-cartoon-planets-funny-universe-for-kids-sun-pluto-mars-mercury-earth-venus-RWKXPP.jpg",
                "https://img.freepik.com/premium-vector/space-galaxy-kids-design-with-dog-sun-star_145790-1468.jpg",
                "https://images.twinkl.co.uk/tw1n/image/private/t_630_eco/website/uploaded/solar-system-colour-1709723614.jpg" 
            ];
            
            let currentImage = spaceImages[Math.floor(Math.random() * spaceImages.length)];

            // Initialize game
            initPuzzle();
            startTimer();
            
            // Hide loading screen after everything is loaded
            setTimeout(() => {
                loadingScreen.style.opacity = '0';
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                }, 500);
            }, 1500);

            function initPuzzle() {
                clearFeedback();
                puzzleContainer.innerHTML = '';
                pieces = [];
                gameActive = true;
                
                // Create puzzle pieces
                for (let row = 0; row < 3; row++) {
                    for (let col = 0; col < 3; col++) {
                        const piece = document.createElement('div');
                        piece.className = 'puzzle-piece';
                        piece.draggable = true;
                        piece.style.backgroundImage = `url('${currentImage}')`;
                        piece.style.backgroundPosition = `${-col * 100}px ${-row * 100}px`;
                        piece.dataset.originalRow = row;
                        piece.dataset.originalCol = col;
                        
                        piece.addEventListener('dragstart', handleDragStart);
                        piece.addEventListener('dragend', handleDragEnd);
                        
                        pieces.push(piece);
                    }
                }
                
                createSlots();
                shufflePieces();
            }

            function createSlots() {
                for (let row = 0; row < 3; row++) {
                    for (let col = 0; col < 3; col++) {
                        const slot = document.createElement('div');
                        slot.className = 'puzzle-slot';
                        slot.dataset.row = row;
                        slot.dataset.col = col;
                        
                        slot.addEventListener('dragover', handleDragOver);
                        slot.addEventListener('drop', handleDrop);
                        
                        puzzleContainer.appendChild(slot);
                    }
                }
            }

            function shufflePieces() {
                if (!gameActive) return;
                
                const slots = document.querySelectorAll('.puzzle-slot');
                slots.forEach(slot => {
                    if (slot.firstChild) {
                        slot.removeChild(slot.firstChild);
                    }
                });
                
                // Fisher-Yates shuffle
                for (let i = pieces.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [pieces[i], pieces[j]] = [pieces[j], pieces[i]];
                }
                
                pieces.forEach((piece, index) => {
                    const slot = slots[index];
                    slot.appendChild(piece);
                    piece.dataset.currentRow = slot.dataset.row;
                    piece.dataset.currentCol = slot.dataset.col;
                });
            }

            function handleDragStart(e) {
                if (!gameActive) {
                    e.preventDefault();
                    return;
                }
                draggedPiece = this;
                e.dataTransfer.effectAllowed = 'move';
            }

            function handleDragEnd() {
                draggedPiece = null;
            }

            function handleDragOver(e) {
                if (gameActive) e.preventDefault();
            }

            function handleDrop(e) {
                if (!gameActive || !draggedPiece) {
                    e.preventDefault();
                    return;
                }
                
                e.preventDefault();
                
                if (this.firstChild) {
                    const existingPiece = this.firstChild;
                    const fromSlot = document.querySelector(
                        `[data-row="${draggedPiece.dataset.currentRow}"][data-col="${draggedPiece.dataset.currentCol}"]`
                    );
                    
                    fromSlot.appendChild(existingPiece);
                    existingPiece.dataset.currentRow = fromSlot.dataset.row;
                    existingPiece.dataset.currentCol = fromSlot.dataset.col;
                }
                
                this.appendChild(draggedPiece);
                draggedPiece.dataset.currentRow = this.dataset.row;
                draggedPiece.dataset.currentCol = this.dataset.col;
                
                checkWin();
            }

            function checkWin() {
                const isSolved = pieces.every(piece => 
                    parseInt(piece.dataset.currentRow) === parseInt(piece.dataset.originalRow) && 
                    parseInt(piece.dataset.currentCol) === parseInt(piece.dataset.originalCol)
                );
                
                if (isSolved) {
                    gameActive = false;
                    clearInterval(timer);
                    showFeedback("Cosmic Success! <span class='emoji'>👨‍🚀🚀🎉</span>", "win");
                }
            }

            function startTimer() {
                clearInterval(timer);
                timeLeft = 120;
                updateTimerDisplay();
                
                timer = setInterval(() => {
                    timeLeft--;
                    updateTimerDisplay();
                    
                    if (timeLeft <= 0) {
                        clearInterval(timer);
                        gameActive = false;
                        showFeedback("Time's Up! Try Again <span class='emoji'>⏰😢</span>", "lose");
                    } else if (timeLeft === 60) {
                        showFeedback("1 minute left! <span class='emoji'>⏳</span>");
                    } else if (timeLeft === 30) {
                        showFeedback("30 seconds remaining! <span class='emoji'>🚨</span>");
                    }
                }, 1000);
            }

            function updateTimerDisplay() {
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerElement.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                
                // Change color when time is running low
                if (timeLeft <= 30) {
                    timerElement.classList.add('critical-time');
                } else if (timeLeft <= 60) {
                    timerElement.style.color = "#ff9800";
                    timerElement.classList.remove('critical-time');
                } else {
                    timerElement.style.color = "#00f7ff";
                    timerElement.classList.remove('critical-time');
                }
            }

            function showFeedback(message, type = "") {
                feedbackElement.innerHTML = message;
                feedbackElement.className = "feedback " + type;
            }

            function clearFeedback() {
                feedbackElement.textContent = "";
                feedbackElement.className = "feedback";
            }

            function newPuzzle() {
                let newImage;
                do {
                    newImage = spaceImages[Math.floor(Math.random() * spaceImages.length)];
                } while (newImage === currentImage && spaceImages.length > 1);
                
                currentImage = newImage;
                initPuzzle();
                startTimer();
            }

            // Event listeners
            shuffleBtn.addEventListener('click', shufflePieces);
            resetBtn.addEventListener('click', newPuzzle);
        });
    </script>
</body>
</html>
